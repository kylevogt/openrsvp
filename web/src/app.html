<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>OpenRSVP — Beautiful Invitations, Zero Ads</title>
		<meta name="description" content="Create stunning event invitations and manage RSVPs. Self-hosted, privacy-first, and completely free." />
		<meta name="theme-color" content="#FAFAF9" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0C0A09" media="(prefers-color-scheme: dark)" />
		<link rel="preload" href="/fonts/satoshi-700.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/plus-jakarta-sans-variable.woff2" as="font" type="font/woff2" crossorigin />
		<style>
			html { color-scheme: light; background-color: #FAFAF9; }
			html[data-theme="dark"] { color-scheme: dark; background-color: #0C0A09; }
			body { margin: 0; font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: inherit; -webkit-font-smoothing: antialiased; }
			@keyframes spin { to { transform: rotate(360deg); } }
			.loading-spinner { width: 2rem; height: 2rem; border-radius: 50%; border: 2px solid transparent; border-bottom-color: #E54666; animation: spin 1s linear infinite; }
		</style>
		<script>
			// Runs before first paint so the page never flashes the wrong theme.
			// Also pins <meta theme-color> to the resolved theme, since an explicit
			// in-app choice can differ from the OS preference the media queries read.
			(function(){
				var t=localStorage.getItem('theme');
				var dark=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches);
				if(!dark)return;
				document.documentElement.setAttribute('data-theme','dark');
				var m=document.querySelectorAll('meta[name="theme-color"]');
				for(var i=1;i<m.length;i++)m[i].remove();
				if(m.length){m[0].removeAttribute('media');m[0].setAttribute('content','#0C0A09')}
			})()
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
