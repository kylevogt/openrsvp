name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npm run check
      - run: cd web && npm run build
      # NOTE: `npm run test:visual` (Playwright visual regression) is intentionally
      # NOT run here: it requires a running backend/server and is not headless-safe
      # in CI without standing up the full app, so it would reliably fail.

  backend:
    name: Backend (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.24', '1.25']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc
      - run: go mod download
      - name: Create frontend placeholder for go:embed
        run: mkdir -p internal/server/frontend && touch internal/server/frontend/index.html
      - run: go vet ./...
      - name: Run tests with coverage
        run: go test -race -v -coverprofile=coverage.out -covermode=atomic ./...
      - name: Print total coverage
        run: go tool cover -func=coverage.out | tail -1
      - name: Upload coverage to Codecov
        if: matrix.go == '1.25'
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
        with:
          files: coverage.out
          fail_ci_if_error: false
      - run: go build -o /dev/null ./cmd/openrsvp

  backend-postgres:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openrsvp
          POSTGRES_PASSWORD: openrsvp
          POSTGRES_DB: openrsvp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openrsvp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://openrsvp:openrsvp@localhost:5432/openrsvp_test?sslmode=disable
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc
      - run: go mod download
      - name: Create frontend placeholder for go:embed
        run: mkdir -p internal/server/frontend && touch internal/server/frontend/index.html
      - name: Run tests against PostgreSQL
        run: go test -race ./...

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.4'
      - name: Create frontend placeholder for go:embed
        run: mkdir -p internal/server/frontend && touch internal/server/frontend/index.html
      - name: golangci-lint
        # Blocking gate. golangci-lint v2.12.2 binaries are built with go1.26.x
        # and type-check the go1.26 codebase cleanly (the old go/types panic on
        # v2.1.0 is gone). Findings fail the build; see .golangci.yml for the
        # enabled linters and the documented pre-existing burn-down allow-list.
        uses: golangci/golangci-lint-action@db582008a42febd596419635a5abc9d9815daa9c # v9.2.1
        with:
          version: v2.12.2

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    # Run on the toolchain the project actually targets. go1.26.6 patches
    # GO-2026-6218 (net/url), GO-2026-6091 (html/template), GO-2026-6090
    # (crypto/tls), GO-2026-6089 and GO-2026-5026 (net/http), GO-2026-6088
    # (encoding/xml) and GO-2026-5972 (encoding/asn1), on top of the crypto/tls,
    # crypto/x509 and net/textproto advisories 1.26.5 already covered;
    # GOTOOLCHAIN=local pins the analysis to the installed version so the scan
    # reflects 1.26.6.
    # Keep this current as new stdlib advisories land: the Dockerfile builds on the
    # floating golang:1.26-alpine, so a stale pin here fails the gate on a
    # vulnerability the shipped binary does not actually carry.
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'
      - name: Create frontend placeholder for go:embed
        run: mkdir -p internal/server/frontend && touch internal/server/frontend/index.html
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Run govulncheck
        # Blocking gate. Reported vulnerabilities fail the build.
        run: govulncheck ./...

  e2e:
    name: End-to-End (Playwright)
    runs-on: ubuntu-latest
    # Gated like the docker job: this builds the whole app, so there is no point
    # spending a runner on it once the unit-level gates have already failed.
    needs: [frontend, backend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            tests/e2e/package-lock.json
      - name: Install dependencies
        # gcc is needed for CGO (go-sqlite3).
        run: sudo apt-get update && sudo apt-get install -y gcc
      - run: go mod download
      - run: cd web && npm ci
      - run: cd tests/e2e && npm ci
      - name: Install Playwright browser
        # --with-deps pulls the system libraries chromium needs on the runner.
        # E2E_SKIP_BROWSER_INSTALL then stops the script re-doing this.
        run: cd tests/e2e && npx playwright install --with-deps chromium
      - name: Run end-to-end suite
        env:
          E2E_SKIP_BROWSER_INSTALL: '1'
        run: make e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-failure-artifacts
          path: tests/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
